name: Testar coleta de Maceió (diagnóstico)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["coletor/fontes/maceio_jsf.py", ".github/workflows/testar-maceio.yml"]

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Coletar só Maceió
        run: |
          python - <<'PY'
          import logging, json
          logging.basicConfig(level=logging.INFO)
          from coletor.fontes import maceio_jsf
          from coletor.util import agora, DOCS
          st, tabs = maceio_jsf.coletar(agora().year)
          resumo = {"status": st.como_dict(), "tabelas": [{"nome": n, "linhas": len(d), "colunas": list(map(str, d.columns)),
                     "amostra": d.head(15).to_dict(orient="records")} for n, _, d in tabs]}
          (DOCS / "paginas" / "prefeitura-maceio" / "resumo-teste.json").write_text(json.dumps(resumo, ensure_ascii=False, indent=2))
          print(json.dumps(resumo["status"], ensure_ascii=False))
          PY
      - name: Guardar diagnóstico
        run: |
          git config user.name "Time Mourinha (robô)"
          git config user.email "robo@users.noreply.github.com"
          git add -A docs/paginas/prefeitura-maceio
          git diff --cached --quiet || git commit -m "Diagnóstico: telas de Maceió"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done

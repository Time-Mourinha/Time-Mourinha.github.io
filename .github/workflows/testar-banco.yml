name: Testar banco
on:
  push:
    branches: [main]
    paths: ["scripts/teste_banco.py", ".github/workflows/testar-banco.yml"]
  workflow_dispatch:
jobs:
  testar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests && cd scripts && python teste_banco.py

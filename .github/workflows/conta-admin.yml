name: Conta da administração

on:
  push:
    branches: [main]
    paths: ["scripts/conta_admin.py", ".github/workflows/conta-admin.yml"]
  workflow_dispatch:

jobs:
  conta:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests && cd scripts && python conta_admin.py

name: Notícias da mídia

# Notícias negativas da imprensa (últimas 72h) por secretaria.
# A rodada automática acontece junto com a coleta diária da meia-noite; aqui fica só o botão para rodar na hora.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: midia
  cancel-in-progress: true

jobs:
  midia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests pyyaml pandas
      - uses: actions/cache/restore@v4
        with:
          path: |
            site/dados
            dados/brutos/cnpj_cache.json
            dados/brutos/sancoes_cache.json
          key: dados-${{ github.run_id }}
          restore-keys: dados-
      - run: python -m coletor.midia
      - uses: actions/cache/save@v4
        with:
          path: |
            site/dados
            dados/brutos/cnpj_cache.json
            dados/brutos/sancoes_cache.json
          key: dados-${{ github.run_id }}

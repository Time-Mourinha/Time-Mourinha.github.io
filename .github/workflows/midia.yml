name: Notícias da mídia

# Notícias negativas da imprensa (últimas 72h) por secretaria: 7h, 12h e 17h de Maceió.
on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: midia
  cancel-in-progress: true

jobs:
  midia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests pyyaml pandas
      - uses: actions/cache/restore@v4
        with:
          path: |
            site/dados
            dados/brutos/cnpj_cache.json
            dados/brutos/sancoes_cache.json
          key: dados-${{ github.run_id }}
          restore-keys: dados-
      - run: python -m coletor.midia
      - uses: actions/cache/save@v4
        with:
          path: |
            site/dados
            dados/brutos/cnpj_cache.json
            dados/brutos/sancoes_cache.json
          key: dados-${{ github.run_id }}

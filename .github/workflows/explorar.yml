name: Explorar portais (diagnóstico)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/explorar.txt", "notificacoes/explorar.py", ".github/workflows/explorar.yml"]

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pyyaml pandas
      - name: Chaves do Supabase (ponte)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python notificacoes/supabase_setup.py chaves
      - run: python -m notificacoes.explorar
      - name: Guardar
        run: |
          git config user.name "Time Mourinha (robô)"
          git config user.email "robo@users.noreply.github.com"
          git add -A docs/explorar
          git diff --cached --quiet || git commit -m "Diagnóstico: páginas dos portais"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done

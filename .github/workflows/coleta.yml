name: Coleta diária e publicação

on:
  schedule:
    - cron: "0 9 * * *"     # 06:00 em Maceió
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ["site/**", "coletor/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Testes do processamento
        run: python -m pytest -q tests

      # Guarda os dados da última coleta boa: se um portal sair do ar, o site continua com os dados anteriores.
      - name: Recuperar dados anteriores
        uses: actions/cache/restore@v4
        with:
          path: |
            site/dados
            dados/brutos/cnpj_cache.json
            dados/brutos/sancoes_cache.json
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - name: Coletar dados (Governo de Alagoas e Prefeitura de Maceió)
        id: coleta
        env:
          CGU_API_KEY: ${{ secrets.CGU_API_KEY }}
        run: |
          set +e
          python -m coletor.main
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Salvar dados desta coleta
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            site/dados
            dados/brutos/cnpj_cache.json
            dados/brutos/sancoes_cache.json
          key: dados-${{ github.run_id }}

      - name: Guardar mapa dos portais e amostras no repositório
        run: |
          git config user.name "Time Mourinha (robô)"
          git config user.email "robo@users.noreply.github.com"
          git add docs/mapa-portal-*.json docs/inventario-tabelas-*.json dados/amostras 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Coleta $(date -u +%F): mapa dos portais e amostras"
          git push || true

      - name: Avisar se alguma esfera ficou sem dados
        if: steps.coleta.outputs.codigo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Coleta de $(date +%d/%m/%Y) com problema" \
            --body "A coleta automática não conseguiu despesas de pelo menos uma esfera. Veja o log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} e a página Saúde dos dados do site. O site continua mostrando os dados da última coleta boa." || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

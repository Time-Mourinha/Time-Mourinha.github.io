name: Publicar o site

# Publica o site na hora: quando o layout muda e sempre que uma coleta termina.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/publicar.yml"]
  workflow_run:
    workflows: ["Configurar o Supabase"]
    types: [completed]
  workflow_run:
    workflows: ["Coleta diária e publicação", "Notícias da mídia"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pegar os dados da última coleta
        uses: actions/cache/restore@v4
        with:
          path: site/dados
          key: dados-${{ github.run_id }}
          restore-keys: dados-
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Colocar a chave pública do Supabase no site
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          pip install -q requests
          python notificacoes/supabase_setup.py chaves
      - name: Gravar a chave no config.js
        run: |
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            sed -i "s|SUPABASE_ANON_KEY: \"\"|SUPABASE_ANON_KEY: \"$SUPABASE_ANON_KEY\"|" site/js/config.js
            grep -c "SUPABASE_ANON_KEY: \"\"" site/js/config.js || true
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

name: Publicar interface
# Gera o site (Vite) e publica no GitHub Pages.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "index.html", "package.json", "package-lock.json", "vite.config.ts", "tsconfig.json", "modelo.config.json", "google/**", ".github/workflows/publicar.yml"]
  workflow_run:
    workflows: ["Configurar banco"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Aplicar o modelo (nomes, cores, unidades)
        run: python3 scripts/aplicar_config.py
      - name: Endereço e chave pública do Supabase
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            pip install -q requests && python scripts/supabase_setup.py chaves
          else
            echo "::warning::Sem Supabase: o site sai em modo de demonstração."
          fi
      - name: Script do Google Drive pronto para copiar (só chaves públicas)
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          c = json.load(open("modelo.config.json"))
          t = pathlib.Path("google/drive.gs").read_text(encoding="utf-8")
          t = t.replace("{{SUPABASE_URL}}", os.environ.get("VITE_SUPABASE_URL", "")).replace("{{SUPABASE_CHAVE}}", os.environ.get("VITE_SUPABASE_PUBLISHABLE_KEY", "")).replace("{{PASTA}}", c.get("drive_pasta", "Relatórios"))
          pathlib.Path("public/google-drive-script.txt").write_text(t, encoding="utf-8")
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4

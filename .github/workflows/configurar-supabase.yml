name: Configurar o Supabase

# Monta o banco, o login, a ponte em São Paulo e a função do WhatsApp no projeto Supabase do time.
# Precisa só do segredo SUPABASE_ACCESS_TOKEN. Roda sozinho quando o banco ou as funções mudam.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/supabase.sql", "supabase/**", "notificacoes/supabase_setup.py", "site/js/config.js", ".github/workflows/configurar-supabase.yml"]

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  configurar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions)."; exit 1
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Banco, regras de segurança e login
        run: python notificacoes/supabase_setup.py
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Publicar a ponte e a função do WhatsApp
        run: |
          supabase secrets set --yes --project-ref "$SUPABASE_REF" PONTE_CHAVE="$PONTE_CHAVE"
          supabase functions deploy ponte --project-ref "$SUPABASE_REF" --no-verify-jwt --use-api --yes
          supabase functions deploy whatsapp --project-ref "$SUPABASE_REF" --no-verify-jwt --use-api --yes
      - name: Testar a ponte (rodando em São Paulo) nos sites do governo
        run: |
          for alvo in https://transparencia.al.gov.br/ https://dados.al.gov.br/catalogo/api/3/action/package_search?rows=1 https://servicodados.ibge.gov.br/api/v1/localidades/estados/27 https://www.agenciaalagoas.al.gov.br/ https://transparencia.maceio.al.gov.br/; do
            code=$(curl -s -m 90 -o /tmp/p.html -w "%{http_code}" -H "x-chave: $PONTE_CHAVE" -H "x-region: sa-east-1" --get --data-urlencode "url=$alvo" "$PONTE_URL")
            echo "PONTE $alvo -> HTTP $code, $(wc -c < /tmp/p.html) bytes: $(head -c 160 /tmp/p.html | tr '\n' ' ')"
          done

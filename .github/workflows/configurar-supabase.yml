name: Configurar banco

on:
  push:
    branches: [main]
    paths: ["supabase/**", "scripts/supabase_setup.py", ".github/workflows/configurar-supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  configurar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Aplicar esquema, unidades e login
        run: |
          pip install -q requests cryptography
          python scripts/supabase_setup.py
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Publicar a função de avisos
        run: supabase functions deploy avisar --project-ref apqkewsdzwawtiajbmyl --no-verify-jwt --use-api --yes

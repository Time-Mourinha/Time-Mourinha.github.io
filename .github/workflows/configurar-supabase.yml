name: Configurar banco

on:
  push:
    branches: [main]
    paths: ["supabase/**", "scripts/supabase_setup.py", "scripts/aplicar_config.py", "modelo.config.json", "src/data/unidades.json", ".github/workflows/configurar-supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  configurar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}   # só para site novo: e-mail de quem administra (nunca fica no código)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Aplicar esquema, unidades e login
        run: |
          pip install -q requests cryptography
          python scripts/aplicar_config.py
          python scripts/supabase_setup.py
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Publicar as funções (avisos e fotos do Drive)
        run: |
          REF="$(python3 -c "import json;print(json.load(open('modelo.config.json'))['supabase_ref'])")"
          supabase functions deploy avisar --project-ref "$REF" --no-verify-jwt --use-api --yes
          supabase functions deploy foto --project-ref "$REF" --use-api --yes
